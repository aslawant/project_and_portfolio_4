<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Movie Success Predictor</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <div class="wrap">

    <div class="appbar">
      <div class="brand">
        <div class="logo"></div>
        <div class="brand-title">
          <div class="title">Movie Success Predictor</div>
          <div class="subtitle">Enter details → Get prediction</div>
        </div>
      </div>
      <div class="nav-actions">
        <span class="hint">Threshold: ${{ threshold_fmt }}</span>
      </div>
    </div>

    <header class="header">
      <div>
        <h1>Predict Movie Success</h1>
        <p class="sub">
          Enter a few movie attributes and the model will estimate revenue + the likelihood of success.
        </p>
      </div>
    </header>

    <main class="main">
      <section class="card">
        <h2 class="card-title">Inputs</h2>

        <form method="POST" action="/predict" class="form">
          <div class="grid">
            <div class="field">
              <label>Budget (USD)</label>
              <input name="Budget" type="number" step="1" min="0" value="{{ values.get('Budget', 50000000) }}" required />
            </div>

            <div class="field">
              <label>Runtime (minutes)</label>
              <input name="Runtime" type="number" step="1" min="0" value="{{ values.get('Runtime', 120) }}" required />
            </div>

            <div class="field">
              <label>Popularity</label>
              <input name="Popularity" type="number" step="0.000001" min="0" value="{{ values.get('Popularity', 25.0) }}" required />
            </div>

            <div class="field">
              <label>Vote Average</label>
              <input name="Vote_Average" type="number" step="0.01" min="0" max="10" value="{{ values.get('Vote_Average', 7.2) }}" required />
            </div>

            <div class="field">
              <label>Vote Count</label>
              <input name="Vote_Count" type="number" step="1" min="0" value="{{ values.get('Vote_Count', 3000) }}" required />
            </div>

            <div class="field">
              <label>Genre</label>
              <select name="Genres" required>
                {% for g in genres %}
                  <option value="{{ g }}" {% if values.get('Genres','Action') == g %}selected{% endif %}>{{ g }}</option>
                {% endfor %}
              </select>
            </div>

            <div class="field">
              <label>Release Year</label>
              <input name="Release_Year" type="number" step="1" value="{{ values.get('Release_Year', 2020) }}" required />
            </div>

            <div class="field">
              <label>Release Month (1–12)</label>
              <input name="Release_Month" type="number" step="1" min="1" max="12" value="{{ values.get('Release_Month', 7) }}" required />
            </div>
          </div>

          <div class="actions">
            <button type="submit" class="btn primary">Predict</button>
            <button type="button" class="btn ghost" onclick="window.location='/'">Reset</button>
          </div>
        </form>
      </section>
    </main>
  </div>
</body>
</html>
